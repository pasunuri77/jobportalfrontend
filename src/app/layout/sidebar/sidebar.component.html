<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Brand/logo moved to header -->

  <div class="sidebar-header">
    <button class="toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar">
      <span class="material-icons-outlined toggle-icon" aria-hidden="true">menu</span>
    </button>
    <span class="menu-label" *ngIf="!isCollapsed">Main Menu</span>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li class="nav-item" *ngFor="let item of menuItems">
        <button
          class="nav-link"
          [class.active]="isActive(item.path)"
          (click)="navigateTo(item.path)"
          [title]="isCollapsed ? item.label : ''"
        >
          <!-- Handle inline SVGs dynamically via ngSwitch -->
          <ng-container [ngSwitch]="item.icon">

            <!-- Profile/User icon -->
            <span *ngSwitchCase="'user'" class="material-icons-outlined nav-icon" aria-hidden="true">person</span>

            <!-- Applications/File text icon -->
            <span *ngSwitchCase="'file-text'" class="material-icons-outlined nav-icon" aria-hidden="true">description</span>

            <!-- Saved Jobs/Bookmark icon -->
            <span *ngSwitchCase="'work'" class="material-icons-outlined nav-icon" aria-hidden="true">work</span>

            <!-- Companies/Building icon -->
            <span *ngSwitchCase="'building'" class="material-icons-outlined nav-icon" aria-hidden="true">business</span>


            <!-- Settings icon -->
            <span *ngSwitchCase="'settings'" class="material-icons-outlined nav-icon" aria-hidden="true">settings</span>
          </ng-container>

          <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
          <span class="active-dot" *ngIf="isActive(item.path)"></span>
        </button>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-link" (click)="onLogout()" [title]="isCollapsed ? 'Logout' : ''">
      <span class="material-icons-outlined nav-icon" aria-hidden="true">logout</span>
      <span class="nav-text" *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</aside>
